# My ODK Client — stack propria, isolada do ODK Central.
#
# ATENCAO: a aplicacao da Fase 2a ainda nao existe. Este arquivo prepara o
# roteamento e os limites; nao ha imagem para subir ainda.
#
# Regras (PLAN.md §6.4):
#   - nunca incluir este arquivo no compose do Central
#   - nenhum volume, banco ou segredo do Central e compartilhado
#   - a unica rede compartilhada e a de borda do Traefik, por necessidade de roteamento

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${IMAGE:-my-odk-client:latest}
    container_name: my-odk-client
    restart: unless-stopped
    environment:
      APP_PORT: "8602"
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOWED_CENTRAL_HOSTS: ${ALLOWED_CENTRAL_HOSTS}
      ALLOWED_PROJECT_IDS: ${ALLOWED_PROJECT_IDS}
    expose:
      - "8602"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.odk-cliente.rule=Host(`odk-cliente.lucianovilasboas.com.br`)"
      - "traefik.http.routers.odk-cliente.entrypoints=websecure"
      - "traefik.http.routers.odk-cliente.tls.certresolver=letsencrypt"
      - "traefik.http.routers.odk-cliente.service=odk-cliente"
      - "traefik.http.services.odk-cliente.loadbalancer.server.port=8602"
      # Cabecalhos que a PWA precisa; o service worker exige escopo na raiz.
      - "traefik.http.middlewares.odk-cliente-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.odk-cliente-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.odk-cliente-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.routers.odk-cliente.middlewares=odk-cliente-headers@docker"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

networks:
  proxy:
    external: true
